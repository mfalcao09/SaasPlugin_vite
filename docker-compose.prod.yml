# NexvyLAW Tribunais — stack de produção (VPS, Traefik por labels)
# Segredos vivem SÓ no .env ao lado deste arquivo na VPS (nunca no repo).
services:
  tribunais-app:
    build: .
    container_name: nexvylaw-tribunais
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    volumes:
      # Acervo de PDFs capturados + cache de respostas IA sobrevivem a deploys.
      - tribunais-fixtures:/app/fixtures
    networks: [traefik-public]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.tribunais-http.rule=Host(`tribunais.nexvylaw.com.br`)
      - traefik.http.routers.tribunais-http.entrypoints=web
      - traefik.http.routers.tribunais-http.middlewares=redirect-to-https
      - traefik.http.routers.tribunais-https.rule=Host(`tribunais.nexvylaw.com.br`)
      - traefik.http.routers.tribunais-https.entrypoints=websecure
      - traefik.http.routers.tribunais-https.tls.certresolver=letsencrypt
      # Piloto: login-dev sem senha => porta fechada com o basicAuth JÁ
      # existente no Traefik (dashboard-auth, mesma senha do painel/Netdata).
      - traefik.http.routers.tribunais-https.middlewares=dashboard-auth@file
      - traefik.http.services.tribunais.loadbalancer.server.port=3000
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

volumes:
  tribunais-fixtures:

networks:
  traefik-public:
    external: true
