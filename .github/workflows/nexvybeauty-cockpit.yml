name: NexvyBeauty Cockpit

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/NexvyBeauty/**'
      - '.github/workflows/nexvybeauty-cockpit.yml'
  pull_request:
    paths:
      - 'apps/NexvyBeauty/**'
      - '.github/workflows/nexvybeauty-cockpit.yml'

defaults:
  run:
    working-directory: apps/NexvyBeauty

jobs:
  cockpit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/NexvyBeauty/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck Cockpit
        run: npm run typecheck:cockpit

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Static paths only: no event-controlled values enter shell commands.
      - name: Deno check Camila entrypoints
        run: >
          deno check --config deno.json --lock deno.lock --frozen
          supabase/functions/platform-sales-brain/index.ts
          supabase/functions/platform-cold-outreach/index.ts
          supabase/functions/platform-whatsapp-qr-webhook/index.ts
          supabase/functions/platform-whatsapp-qr-send/index.ts
          supabase/functions/platform-camila-conductor/index.ts
          supabase/functions/platform-start-whatsapp-conversation/index.ts

      - name: Deno tests Camila safety and cold outreach
        run: >
          deno test --config deno.json --lock deno.lock --frozen --allow-read --allow-env
          supabase/functions/_shared/cold-outreach
          supabase/functions/_shared/platform-crm-find-create-lead.test.ts
          supabase/functions/_shared/platform-crm-lead-context.test.ts
          supabase/functions/_shared/platform-crm-lead-memory-migration.test.ts
          supabase/functions/_shared/agent-safety-kernel.test.ts
          supabase/functions/_shared/agent-action-ledger.test.ts
          supabase/functions/_shared/agent-action-ledger-migration.test.ts
          supabase/functions/_shared/agent-action-ledger-wiring.test.ts
          supabase/functions/_shared/platform-whatsapp-qr-send-security.test.ts
          supabase/functions/_shared/agent-routing.test.ts
          supabase/functions/_shared/zapi-webhook-normalize.test.ts
          supabase/functions/_shared/qr-send-message-id.test.ts

      - name: Deno tests (Evolution shared + cakto)
        run: >
          deno test --frozen --allow-read --allow-env
          supabase/functions/_shared/evolution-webhook-auth.test.ts
          supabase/functions/_shared/evolution-baileys-jid.test.ts
          supabase/functions/_shared/evolution-quoted.test.ts
          supabase/functions/_shared/cakto-plan-provisioning.test.ts
