# Fim do onboarding: a dona (ainda SEM sessão) define a própria senha. Auth real
# na função = token do link de implantação + session_token da sessão corrente,
# e o token é queimado depois. Sem esta entrada, um redeploy religa o JWT e a
# compradora fica sem conseguir criar a senha.
[functions.onboarding-set-password]
verify_jwt = false

[functions.platform-webhook-receiver]
verify_jwt = false

# Webhook público do Evolution Go (servidor externo -> plataforma). Sem JWT.
[functions.platform-evolution-webhook]
verify_jwt = false

# Webhook público do Evolution (servidor externo -> TENANT/salão). Sem JWT no
# gateway (a Evolution não manda Authorization). Auth real na função = a
# instância do payload PRECISA existir em evolution_instances (payload de
# instância desconhecida é ignorado). Já rodava assim em prod (deploy com
# --no-verify-jwt); o bloco aqui torna isso determinístico em redeploys.
# Eventos de HISTÓRICO (MESSAGES_SET/CHATS_SET/CONTACTS_SET, F6) são
# encaminhados server-to-server pra evolution-history-sync — que fica DE FORA
# deste arquivo de propósito: lá o gateway exige JWT (default) e a função ainda
# valida Bearer == service_role + apikey do payload vs instance_token.
[functions.evolution-webhook]
verify_jwt = false

# Webhook público da WhatsApp Cloud API (Meta -> plataforma, número de vendas).
# Auth real = X-Hub-Signature-256 (HMAC do app_secret) validada na função.
[functions.platform-meta-whatsapp-webhook]
verify_jwt = false

# Webhook Meta Cloud API do TENANT (org-scoped) — gêmeo do de plataforma acima.
# Porte reverso de oficial-vendus-v5 (Bloco 1 do cutover Studio Flor). A Meta
# assina o payload e não manda Authorization: por isso sem JWT no gateway.
# Auth real DENTRO da função (verificada, index.ts:102-107): HMAC-SHA256 do corpo
# cru contra o app_secret da conexão, comparado com timingSafeEqual. Assinatura
# que não bate → descartado.
# As outras 8 funções desta leva NÃO entram aqui: autenticam por
# authenticateTenant + assertOrgAccess e devem manter verify_jwt no default.
[functions.meta-whatsapp-webhook]
verify_jwt = false

# Embedded Signup do gestao (super_admin). Gateway exige JWT; a função ainda
# revalida com authenticatePlatformAgent e devolve 401 + unauthorized.
[functions.platform-embedded-signup-exchange]
verify_jwt = true

[functions.platform-embedded-signup-register]
verify_jwt = true

# Registro/re-registro de número na Cloud API (aplica display name aprovado pela Meta).
# Chamada server-to-server (operação), não pelo frontend — por isso sem JWT no gateway.
# Auth real DENTRO da função: authenticatePlatformAgent (service_role ou super_admin).
[functions.platform-meta-whatsapp-register]
verify_jwt = false

# Webhook público de DMs do Instagram (Meta -> plataforma). Sem JWT.
# Auth real = X-Hub-Signature-256 (HMAC do app_secret) validada na função.
[functions.platform-instagram-webhook]
verify_jwt = false

# Cérebro de vendas (F2): chamada server-to-server do webhook. Sem JWT.
# Auth real = service-role key OU x-brain-secret (BRAIN_INTERNAL_SECRET) na função.
[functions.platform-sales-brain]
verify_jwt = false

# CANARY do cérebro — alvo do eval (E3), NUNCA de lead real. Mesmo verify_jwt do
# original porque é o MESMO código (import, não cópia): a auth real é feita DENTRO
# da função, e ligar o JWT aqui barraria o harness no gateway, antes de o guard
# rodar — o mesmo 401 que travou o E1 por uma hora.
# APAGAR junto com a pasta assim que o PR-B for promovido: canary esquecido vira
# superfície esquecida.
[functions.platform-sales-brain-canary]
verify_jwt = false

# Dispatcher da Conversions API (Meta) do funil Ads Inbound (G4). Chamada de
# máquina (cron/manual). Sem JWT. Auth = service-role OU x-brain-secret na função.
[functions.platform-capi-send]
verify_jwt = false

# Web-CAPI (Conversions API, action_source:'website') da LP de vendas — espelho
# server-side do Pixel de browser p/ recuperar PageView/Lead bloqueados por
# adblock/ITP (público de remarketing). PÚBLICO por design (LP anônima) → sem JWT.
# Auth = pública + whitelist de event_name + clamp (Seção 11.3). Token só server-side.
[functions.platform-web-capi]
verify_jwt = false

# Runtime PÚBLICO dos formulários de captação da plataforma. Recebe submissão de
# lead EXTERNO (embed anônimo) e usa SERVICE_ROLE internamente — o gateway não
# pode exigir JWT, senão o embed público é rejeitado. Auth = pública por design
# (validação de form ativo + rate-limit + allowlists server-side na própria EF).
[functions.platform-form-submit]
verify_jwt = false

# Callback público do OAuth de Meta Ads (NexvyAds F1). Recebido pelo REDIRECT do
# browser após consentimento — não há JWT. Auth real = state ASSINADO (HMAC)
# validado na própria função (ads-oauth-state.ts). ads-oauth-start e ads-sync
# NÃO entram aqui: exigem JWT super_admin (verify_jwt=true, o default).
[functions.ads-oauth-callback]
verify_jwt = false

# Webhook público do Apify (C9 F0 — motor de extração de leads IG). Apify chama de
# volta ao fim do run, sem JWT. Auth real na função = extraction_id (query) casa com
# o job + run id do payload casa com apify_run_id gravado + dataset só é lido com o
# APIFY_TOKEN do projeto (prova de posse). leads-extraction-start NÃO entra aqui:
# exige JWT super_admin (verify_jwt=true, o default).
[functions.leads-extraction-webhook]
verify_jwt = false

# Webhook do Apify da Importação por vídeo (leads-import-video). Mesma auth do
# webhook padrão (extraction_id + run id ∈ run_ids + APIFY_TOKEN). Insere os leads
# numa ÚNICA busca do dia ("Extração vídeo <data>") — a aba com/link/sem whatsapp é
# DERIVADA em runtime via classifyWhatsapp (contrato 2026-07-19), não é busca física.
# leads-import-video (o disparador) NÃO entra aqui: exige JWT super_admin (verify_jwt=true, o default).
[functions.leads-import-video-webhook]
verify_jwt = false

# Import de perfis JÁ coletados direto no staging do C9 (irmão do webhook, mas recebe
# os perfis no POST em vez de baixar do dataset). Sem JWT no gateway; auth real na
# função = x-import-secret (LEADS_IMPORT_SECRET) OU JWT super_admin. Serve o pusher
# local (dados coletados via MCP) e a feature in-app de upload de vídeo.
[functions.leads-import-profiles]
verify_jwt = false

# EF DESCARTÁVEL de evals (braço EVALS-V1): régua binária do brain de vendas.
# Sem JWT — auth real = x-brain-secret (BRAIN_INTERNAL_SECRET) na função. NÃO
# deployar em produção junto com o resto; roda sob demanda e limpa os efêmeros.
[functions.tmp-eval-agents]
verify_jwt = false

# Aplica o payload do wizard de onboarding nas tabelas reais (empresa/horários/setores/
# negócios/agentes/equipes). Chamada com token PÚBLICO + session_token (empresa externa via
# link), então o gateway não pode exigir JWT. Auth real na função = token_hash (SHA-256 do
# token) casa com onboarding_submissions.token_hash + session_token + org não travada. O fluxo
# autenticado (submission_id + Bearer) valida o JWT dentro da própria função.
[functions.apply-onboarding]
verify_jwt = false

# QR do WhatsApp DENTRO do wizard de implantação paga. A compradora só cria a
# senha no ÚLTIMO passo — no passo do QR ela ainda NÃO TEM SESSÃO, então o
# gateway não pode exigir JWT. (Sem este bloco o fluxo volta a dar 401 e a venda
# morre no "coração do espaço" — foi o bug de 20/07/2026 23:20.)
# Auth real na função = token do link (sha256 → onboarding_submissions.token_hash)
# + session_token da aba + link não revogado/expirado + mode != 'demo'. A org vem
# SEMPRE da submission, nunca do body. Expõe só `connect` e `status`: nada
# destrutivo, para que um link vazado não consiga apagar instância de ninguém.
[functions.onboarding-evolution]
verify_jwt = false

# ESTEIRA DEMO — endpoints PÚBLICOS pré-venda (a lead é anônima, sem JWT).
# demo-start: cria a org demo + link do wizard (auth real = honeypot + rate-limit
#   durável por IP/telefone; nada sensível é exposto).
# demo-evolution: motor da demo (auth real = token+session_token do
#   onboarding_submissions mode='demo', OU Bearer service_role p/ chamadas internas).
[functions.demo-start]
verify_jwt = false

[functions.demo-evolution]
verify_jwt = false

# Cron da NINA (retenção): varre contas em D-7 de renovação e aciona a Nina.
# Sem JWT no gateway — auth real na função (service-role bearer/apikey OU
# x-brain-secret, timing-safe). Gated por NINA_HEALTH_SCAN_ENABLED (default OFF).
[functions.nina-health-scan]
verify_jwt = false

# Envio WhatsApp via Evolution BURNER platform-side (cold outreach). Chamada
# server-to-server pelo motor platform-cold-outreach. Sem JWT no gateway; auth
# real na função = Bearer == SERVICE_ROLE_KEY. Twin do tenant evolution-send.
[functions.platform-evolution-send]
verify_jwt = false

# Motor de cold outreach (enqueue/tick/on-inbound/status). Chamado por pg_cron
# (service_role via vault) e por wiring de inbound. Sem JWT no gateway; auth real
# na função = Bearer == SERVICE_ROLE_KEY OU x-cold-secret (COLD_OUTREACH_SECRET).
# DUPLO GATE de envio: campaign.dry_run (default true) + env COLD_OUTREACH_ENABLED.
[functions.platform-cold-outreach]
verify_jwt = false

# Canário interno de cobertura das instâncias Evolution. Chamado por pg_cron com
# Bearer service_role vindo do Vault. A chave service_role pode usar o formato
# opaco `sb_secret_` (não-JWT), então o gateway não deve tentar decodificá-la;
# a função faz o gate interno comparando o Bearer com SUPABASE_SERVICE_ROLE_KEY.
[functions.platform-instance-coverage-canary]
verify_jwt = false

# ── Webhooks PÚBLICOS de terceiros (provider -> plataforma) ──────────────────
# Provedores de pagamento/anúncio NUNCA mandam JWT Supabase; a auth real é feita
# DENTRO de cada função (secret/HMAC/token). Sem estes blocos, um redeploy religa
# verify_jwt=true (default) e o gateway devolve 401 ANTES da função rodar — matando
# a provisão de venda / o webhook em SILÊNCIO. (Auditoria de fluidez do funil, 2026-07.)

# Cakto (venda -> provisão do tenant). Auth = ?secret= / x-cakto-secret validado na função.
# CRÍTICO: sem este bloco, toda venda que chega pela Cakto morre no gateway (401).
[functions.cakto-webhook]
verify_jwt = false

# Reconciliador de comissão: cron/server-to-server com Bearer service_role do vault.
# verify_jwt=false por consistência (service_role no formato novo sb_secret_ não é JWT).
# Auth real = invocação interna; a função usa SERVICE_ROLE internamente.
[functions.cakto-affiliate-reconcile]
verify_jwt = false

# Recuperação de carrinho Cakto: chamada server-to-server com Bearer service_role.
# verify_jwt=false por consistência (service_role no formato novo sb_secret_ não é JWT).
[functions.cakto-recovery-trigger]
verify_jwt = false

# Hotmart (venda -> provisão). Auth = hottok no payload, sem JWT Supabase.
[functions.hotmart-webhook]
verify_jwt = false

# Doppus (venda -> provisão). Auth = header doppus-token, sem JWT Supabase.
[functions.doppus-webhook]
verify_jwt = false

# Lead Ads da Meta (GET hub.challenge/hub.verify_token + POST de lead), sem JWT Supabase.
[functions.facebook-leads-webhook]
verify_jwt = false

# Descadastro one-click de e-mail (token no query; Gmail/Apple mandam POST one-click), sem JWT.
[functions.handle-email-unsubscribe]
verify_jwt = false

# Cadastro-e-aceite de convite de equipe (fecha o exploit de takeover do accept_invitation).
# O convidado ainda NÃO tem sessão ao criar a conta — o gateway não pode exigir JWT. Auth
# real na função = convite pendente cujo e-mail bate com o cadastro (service_role internamente,
# createUser com email_confirm + vínculo atômico via accept_invitation_service). Não é signup
# aberto: só cria conta quando há convite válido. Sem este bloco, redeploy religa verify_jwt=true
# (default) e o cadastro-por-convite morre no gateway (401).
[functions.accept-invite]
verify_jwt = false

# Instagram Login (NEXVY - IGLOG). Start e callback exigem JWT do tenant
# (authenticateTenant). A SPA /instagram/oauth-return faz invoke autenticado.
# NÃO abrir verify_jwt=false — o code volta pela SPA, não pelo redirect cru.
[functions.instagram-login-oauth-start]
verify_jwt = true
[functions.instagram-login-oauth-callback]
verify_jwt = true

# Webhook público de Direct do Instagram Login (Meta → tenant). Sem JWT.
# Auth real = X-Hub-Signature-256 (HMAC de INSTAGRAM_LOGIN_APP_SECRET) na função.
# GET devolve hub.challenge (INSTAGRAM_LOGIN_WEBHOOK_VERIFY_TOKEN). NÃO é Page
# nem platform-instagram-webhook. start-instagram-conversation fica no default
# (verify_jwt=true) — chamada pelo inbox autenticado.
[functions.instagram-login-webhook]
verify_jwt = false
